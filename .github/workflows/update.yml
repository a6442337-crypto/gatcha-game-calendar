name: 일정 수집 및 배포

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 06:17 KST
    - cron: '17 9 * * *'    # 매일 18:17 KST
  workflow_dispatch:
    inputs:
      games:
        description: '특정 게임만 수집 (공백 구분, 비우면 전체). 예: genshin bluearchive'
        required: false
        default: ''
      diagnose:
        description: 'API 키 진단만 실행 (사용 가능 모델·무료 한도 확인)'
        type: boolean
        default: false
      skip_collect:
        description: '수집 없이 사이트만 다시 배포'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'config/**', 'data/overrides.json', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      collect: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 테스트
        run: node --test test/*.test.mjs

      - name: API 진단
        if: inputs.diagnose == true || contains(github.event.head_commit.message, '[diagnose]')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/diagnose.mjs

      - name: 일정 수집 (무료 검색 + Gemini)
        id: collect
        continue-on-error: true
        # 수집이 늦어져도 커밋·배포는 하도록 단계 자체에 시간 제한 (스크립트는 20분 예산 안에서 스스로 멈춤)
        timeout-minutes: 27
        if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')) && inputs.skip_collect != true && inputs.diagnose != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_GROUNDING: ${{ vars.GEMINI_GROUNDING }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COLLECT_BUDGET_MIN: '20'
          # 대체 모델 시험: 커밋 메시지 [fallback-test] → Gemini 끄고 OpenRouter, [groq-test] → Groq만
          DISABLE_GEMINI: ${{ (contains(github.event.head_commit.message, '[fallback-test]') || contains(github.event.head_commit.message, '[groq-test]')) && '1' || '' }}
          FALLBACK_PROVIDERS: ${{ contains(github.event.head_commit.message, '[groq-test]') && 'groq' || (contains(github.event.head_commit.message, '[fallback-test]') && 'openrouter' || '') }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY 시크릿이 없어 수집을 건너뜁니다. Settings → Secrets and variables → Actions 에서 추가하세요."
          else
            node scripts/collect.mjs ${{ inputs.games }}
          fi

      - name: 수집 결과 커밋
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]') || contains(github.event.head_commit.message, '[diagnose]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/state.json data/logs/last-run.json data/overrides.json
          if [ -f data/logs/diagnose.json ]; then git add data/logs/diagnose.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 일정 자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
          fi

      - name: 사이트 빌드
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # 배포는 별도 작업으로: 업로드 직후 바로 찾으면 아티팩트가 아직 조회되지 않아 실패하는 경우가 있음
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 배포 재시도 대기
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: 수집 실패 시 실행을 실패로 표시
        if: needs.collect-and-build.outputs.collect == 'failure'
        run: |
          echo "::error::일정 수집 단계가 실패했습니다(사이트는 기존 데이터로 배포됨). 주석과 data/logs/last-run.json 을 확인하세요."
          exit 1
